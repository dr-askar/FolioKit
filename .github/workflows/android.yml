name: Android debug and corresponding source
on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', 'src/**', 'public/**', 'scripts/**', 'package*.json', 'capacitor.config.ts', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run android:debug
        env:
          DISABLE_UPDATE_CHECK: 'true'
      - name: Bundle complete corresponding source and instructions
        run: |
          mkdir -p android-release
          git archive --format=tar.gz --output=android-release/corresponding-source.tar.gz HEAD
          cp android/app/build/outputs/apk/debug/app-debug.apk android-release/
          cp ANDROID.md LICENSE CONTRIBUTORS.md android-release/
          git rev-parse HEAD > android-release/REVISION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-with-source
          path: android-release/

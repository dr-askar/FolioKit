name: Android APK install compatibility
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published FolioKit release to install'
        required: true
        default: 'v0.1.2-preview'
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Download and verify the exact public or draft release APK
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p install-check
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir install-check
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir install-check
          python3 - <<'PYIN'
          import hashlib
          from pathlib import Path
          apks = list(Path('install-check').glob('*.apk'))
          assert len(apks) == 1, 'Release must contain exactly one universal APK'
          apk = apks[0]
          checksums = Path('install-check/SHA256SUMS.txt').read_text()
          expected = next(line.split()[0] for line in checksums.splitlines() if line.split()[-1] == apk.name)
          actual = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)
          if apk.name != 'FolioKit.apk':
              apk.rename('install-check/FolioKit.apk')
          print('Release APK checksum verified:', actual)
          PYIN
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash scripts/android-install-check.sh install-check/FolioKit.apk install-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-check-api-${{ matrix.api }}
          path: |
            install-check/*.txt
            install-check/*.xml
            install-check/*.png

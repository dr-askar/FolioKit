name: Android APK install compatibility
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published FolioKit release to install'
        required: true
        default: 'v0.1.1-preview.1'
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Download the exact public release APK
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p install-check
          curl --fail --location --retry 3 "https://github.com/dr-askar/FolioKit/releases/download/$RELEASE_TAG/FolioKit-debug.apk" --output install-check/FolioKit.apk
          curl --fail --location --retry 3 "https://github.com/dr-askar/FolioKit/releases/download/$RELEASE_TAG/SHA256SUMS.txt" --output install-check/release-checksums.txt
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = next(line.split()[0] for line in Path('install-check/release-checksums.txt').read_text().splitlines() if line.split()[-1] == 'FolioKit-debug.apk')
          actual = hashlib.sha256(Path('install-check/FolioKit.apk').read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)
          print('Release APK checksum verified:', actual)
          PY
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash scripts/android-install-check.sh install-check/FolioKit.apk install-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-check-api-${{ matrix.api }}
          path: |
            install-check/*.txt
            install-check/*.xml
            install-check/*.png
